<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Galerie</title>
</head>
<body> 
    <nav class="navbar md:navbar-expand bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-white" href="index.html">
                Galerie
            </a>
            <button class="btn-icon navbar-toggler"
                    type="button"
                    data-bs-toggle="drawer"
                    data-bs-target="#navbarDrawer"
                    aria-controls="navbarDrawer"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <dialog class="drawer drawer-end"
                    tabindex="-1"
                    id="navbarDrawer"
                    aria-labelledby="navbarDrawerLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarDrawerLabel">
                        Menu
                    </h5>
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="drawer"
                            aria-label="Close">
                    </button>
                </div>
                <div class="drawer-body mb-2 md:mb-0">
                    <ul class="nav navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link active"
                            aria-current="page"
                            href="index.html">
                                Domů
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="galerie.html">
                                Galerie
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="sluzby.html">
                                Služby
                            </a>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link"
                                    type="button"
                                    data-bs-toggle="menu"
                                    aria-expanded="false">
                                Produkty
                            </button>
                            <div class="menu">
                                <a class="menu-item" href="#">
                                    Kategorie 1
                                </a>
                                <a class="menu-item" href="#">
                                    Kategorie 2
                                </a>
                                <hr class="menu-divider">
                                <a class="menu-item" href="#">
                                    Všechny produkty
                                </a>
                            </div>
                        </li>
                    </ul>
                    <form class="hstack gap-2" role="search">
                        <input class="form-control"
                            type="search"
                            placeholder="Hledat..."
                            aria-label="Hledat">

                        <button class="btn-solid theme-secondary"
                                type="submit">
                            Hledat
                        </button>
                    </form>
                </div>
            </dialog>
        </div>
    </nav>


    <div id="obrazky" class="container d-flex flex-wrap justify-content-center gap-4"></div>
    <script>
        let pole = ["tarantule", "pavouk", "spider", "sklipkan", "skakavka","Orb weaver"];

        for(let i = 0; i <= 5; i++) {
            document.getElementById("obrazky").innerHTML += `
            <figure class="figure text-center">
                <img src="img/spider${i}.jpg" class="figure-img img-fluid rounded" width="300" alt="${pole[i]}">

                <figcaption class="figure-caption">${pole[i]}</figcaption>
             </figure>
                `;
        }
    </script>
      <footer class="site-footer">
        <p>ISpider · Chovatelská stanice pavouků</p>
    </footer>

   <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
